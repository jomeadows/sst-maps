<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Explore McDonough Parks & Playgrounds | Shannon Sells Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--g:#1f3d2b;--g2:#2d5a40;--ink:#16211b;--mut:#6b7570;--line:#e7ebe8;--bg:#fafbfa}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:grid;grid-template-columns:400px 1fr;height:100%}
#panel{display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);min-height:0;z-index:2}
.hd{padding:22px 22px 14px}
.brand{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--g2);display:flex;align-items:center;gap:8px}
.brand i{width:18px;height:2px;background:var(--g2);display:inline-block}
h1{font-size:23px;line-height:1.2;margin:8px 0 4px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--mut)}.sub b{color:var(--ink)}
#list{flex:1;overflow:auto;padding:4px 14px 18px;scrollbar-width:thin}
.card{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer;transition:.18s;background:#fff}
.card:hover,.card.on{border-color:var(--g2);box-shadow:0 6px 20px rgba(31,61,43,.12);transform:translateY(-1px)}
.dot{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.dot svg{width:19px;height:19px}
.ci{flex:1;min-width:0}.ci h3{margin:0 0 5px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;margin-right:6px}
.ad{font-size:12.5px;color:var(--mut);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir{align-self:center;flex:none;font-size:12px;font-weight:600;color:var(--g);text-decoration:none;border:1px solid var(--line);padding:7px 11px;border-radius:99px;transition:.15s}
.dir:hover{background:var(--g);color:#fff;border-color:var(--g)}
#mapwrap{position:relative;min-height:0}#map{position:absolute;inset:0}
#bar{position:absolute;top:16px;left:16px;right:16px;z-index:3;display:flex;gap:10px;flex-wrap:wrap;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 30px rgba(20,35,27,.14);border-radius:99px}
.search{display:flex;align-items:center;gap:8px;padding:0 16px;height:44px;min-width:260px;flex:0 1 340px}
.search input{border:0;background:none;outline:0;font:500 14px Inter,sans-serif;width:100%;color:var(--ink)}
.chips{display:flex;gap:6px;padding:5px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chip{border:0;background:none;font:600 12.5px Inter,sans-serif;padding:8px 14px;border-radius:99px;cursor:pointer;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--g);color:#fff}
.maplibregl-popup-content{border-radius:16px;padding:16px 18px;box-shadow:0 14px 40px rgba(20,35,27,.22);font-family:Inter,sans-serif;min-width:220px}
.maplibregl-popup-close-button{font-size:18px;right:8px;top:6px;color:var(--mut)}
.pp h4{margin:0 0 6px;font-size:15.5px;font-weight:700;letter-spacing:-.01em;padding-right:14px}
.pp .ad{white-space:normal;margin:8px 0 12px}
.pp a{display:inline-block;background:var(--g);color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:99px}
.ft{padding:10px 22px;font-size:11px;color:var(--mut);border-top:1px solid var(--line)}.ft a{color:var(--mut)}
.handle{display:none}
.maplibregl-ctrl-group{border-radius:12px!important;box-shadow:0 6px 20px rgba(20,35,27,.14)!important}
@media(max-width:760px){
#app{display:block}#mapwrap{position:absolute;inset:0}
#bar{top:10px;left:10px;right:10px}.search{flex:1 1 100%;min-width:0}
#panel{position:absolute;left:0;right:0;bottom:0;height:42%;border-radius:22px 22px 0 0;border:0;box-shadow:0 -10px 40px rgba(20,35,27,.18);transition:height .3s}
#panel.full{height:85%}#panel.min{height:118px}
.handle{display:block;width:42px;height:5px;border-radius:9px;background:#d4dad6;margin:10px auto 0;cursor:pointer}
.hd{padding:10px 18px 10px}h1{font-size:18px}.brand{font-size:10px}
.maplibregl-ctrl-top-right{top:104px!important}.maplibregl-ctrl-bottom-right{display:none}.ft{display:block;padding:8px 18px 12px;font-size:10px}}
</style></head><body>
<div id="app"><aside id="panel"><div class="handle" id="handle"></div>
<div class="hd"><div class="brand"><i></i>Shannon Sells Team</div><h1>Explore McDonough Parks & Playgrounds</h1><div class="sub"><b id="count">0</b> <span id="noun">places</span> in and around McDonough, GA</div></div>
<div id="list"></div>
<div class="ft">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors · Tiles <a href="https://openfreemap.org" target="_blank">OpenFreeMap</a>. Details may change; please verify before visiting.</div></aside>
<div id="mapwrap"><div id="map"></div><div id="bar"><label class="search glass"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6b7570" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search parks…"></label><div class="chips glass" id="chips"></div></div></div></div>
<script>
const D=[{"name":"Alexander Park","lat":33.454399,"lon":-84.152881,"addr":"","cat":"Park"},{"name":"Alexander Park West","lat":33.453112,"lon":-84.156746,"addr":"","cat":"Park"},{"name":"Avalon Park","lat":33.416976,"lon":-84.182654,"addr":"","cat":"Park"},{"name":"Big Springs Park","lat":33.451914,"lon":-84.145544,"addr":"","cat":"Park"},{"name":"Central Park North","lat":33.388256,"lon":-84.148484,"addr":"1301 Academic Parkway, Locust Grove","cat":"Park"},{"name":"Central Park South","lat":33.385525,"lon":-84.148073,"addr":"1301 Academic Parkway, Locust Grove","cat":"Park"},{"name":"Heritage Park","lat":33.442562,"lon":-84.12065,"addr":"","cat":"Park with playground"},{"name":"Heritage Park Playground","lat":33.442423,"lon":-84.121276,"addr":"","cat":"Playground"},{"name":"Jonesboro Road Park","lat":33.454361,"lon":-84.17193,"addr":"","cat":"Park"},{"name":"Local Dog Park","lat":33.440639,"lon":-84.070219,"addr":"","cat":"Park"},{"name":"McDonough Square","lat":33.447352,"lon":-84.146824,"addr":"","cat":"Park"},{"name":"Nature Trail Entrance Park","lat":33.443437,"lon":-84.070368,"addr":"","cat":"Park"},{"name":"North Mount Carmel Park","lat":33.453508,"lon":-84.244114,"addr":"307 North Mount Carmel Road, Hampton","cat":"Park"},{"name":"Red Hawk Baseball Complex and Nature Preserve","lat":33.428934,"lon":-84.167873,"addr":"","cat":"Park"},{"name":"Richard Craig Park","lat":33.43609,"lon":-84.142502,"addr":"","cat":"Park"},{"name":"Rufus L. Stewart Park","lat":33.439141,"lon":-84.149291,"addr":"","cat":"Park"}],CLUSTER=false;
const PAL=['#2f8f5b','#d08a2e','#3c7fc4','#c2513f','#7a5bb0','#2a9d9a'];
const ICON='<path d="M12 2 6 11h3l-4 6h14l-4-6h3z"/><path d="M12 17v5"/>';
const cats=[...new Set(D.map(d=>d.cat))].sort((a,b)=>D.filter(d=>d.cat==b).length-D.filter(d=>d.cat==a).length);
const col=c=>PAL[cats.indexOf(c)%PAL.length];
D.forEach((d,i)=>{d.id=i;d.c=col(d.cat)});
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dirU=d=>`https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lon}`;
const svgI=`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON}</svg>`;
let cat='',q='';
const chips=document.getElementById('chips');
[''].concat(cats).forEach(c=>{const b=document.createElement('button');b.className='chip'+(c==''?' on':'');b.innerHTML=(c?`<i style="background:${col(c)}"></i>`:'')+(c||'All');b.onclick=()=>{cat=c;[...chips.children].forEach(x=>x.classList.toggle('on',x==b));upd()};chips.appendChild(b)});
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:[-84.147,33.447],zoom:11.5,attributionControl:false});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'Shannon Sells Team'}),'bottom-right');
function pin(color){const s=`<svg xmlns="http://www.w3.org/2000/svg" width="44" height="54" viewBox="0 0 44 54"><defs><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".3"/></filter></defs><path filter="url(#s)" d="M22 51s17-15.5 17-29A17 17 0 0 0 5 22c0 13.5 17 29 17 29z" fill="#1f3d2b" stroke="#fff" stroke-width="2.5"/><circle cx="22" cy="22" r="9.5" fill="${color}"/><g transform="translate(15.5 15.5) scale(.54)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${ICON}</g></svg>`;return new Promise(r=>{const im=new Image(44,54);im.onload=()=>r(im);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)})}
const fc=a=>({type:'FeatureCollection',features:a.map(d=>({type:'Feature',id:d.id,properties:{id:d.id,cat:d.cat,name:d.name},geometry:{type:'Point',coordinates:[d.lon,d.lat]}}))});
const pc=a=>({type:'FeatureCollection',features:a.filter(d=>d.poly).map(d=>({type:'Feature',id:d.id,properties:{id:d.id,c:d.c},geometry:{type:'MultiPolygon',coordinates:d.poly}}))});
let pop=new maplibregl.Popup({offset:[0,-40],maxWidth:'290px'}),hov=null;
function popup(d){pop.setLngLat([d.lon,d.lat]).setHTML(`<div class="pp"><h4>${e(d.name)}</h4><span class="pill" style="background:${d.c}1f;color:${d.c}">${e(d.cat)}</span>${d.cuisine?`<span class="pill" style="background:#f1f3f2;color:#4a544f">${e(d.cuisine)}</span>`:''}<div class="ad">${e(d.addr||'McDonough area, GA')}</div><a target="_blank" rel="noopener" href="${dirU(d)}">Get directions →</a></div>`).addTo(map)}
function hl(id){if(hov===id)return;hov=id;if(map.getLayer('hl'))map.setFilter('hl',['==',['get','id'],id??-1]);if(map.getLayer('pl'))map.setFeatureState&&D.forEach(d=>d.poly&&map.setFeatureState({source:'poly',id:d.id},{h:d.id===id}));document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',+c.dataset.id===id))}
map.on('load',async()=>{
 for(const c of cats)map.addImage('p-'+c,await pin(col(c)),{pixelRatio:1.35});
 if(D.some(d=>d.poly)){map.addSource('poly',{type:'geojson',data:pc(D)});
  map.addLayer({id:'pf',type:'fill',source:'poly',paint:{'fill-color':'#2f8f5b','fill-opacity':['case',['boolean',['feature-state','h'],false],.38,.16]}});
  map.addLayer({id:'pl',type:'line',source:'poly',paint:{'line-color':'#1f3d2b','line-width':['case',['boolean',['feature-state','h'],false],2.5,1.2],'line-opacity':.7}});
  map.on('click','pf',ev=>{const d=D[ev.features[0].properties.id];popup(d)});map.on('mousemove','pf',ev=>hl(ev.features[0].properties.id))}
 map.addSource('pts',{type:'geojson',data:fc(D),cluster:CLUSTER,clusterRadius:46,clusterMaxZoom:14});
 if(CLUSTER){map.addLayer({id:'cl',type:'circle',source:'pts',filter:['has','point_count'],paint:{'circle-color':'#1f3d2b','circle-radius':['step',['get','point_count'],17,10,22,30,28],'circle-stroke-width':5,'circle-stroke-color':'rgba(47,143,91,.28)'}});
  map.addLayer({id:'cc',type:'symbol',source:'pts',filter:['has','point_count'],layout:{'text-field':'{point_count_abbreviated}','text-font':['Noto Sans Bold'],'text-size':13,'text-allow-overlap':true,'text-ignore-placement':true},paint:{'text-color':'#fff'}});
  map.on('click','cl',async ev=>{const f=ev.features[0];const z=await map.getSource('pts').getClusterExpansionZoom(f.properties.cluster_id);map.easeTo({center:f.geometry.coordinates,zoom:z+.3})})}
 map.addLayer({id:'hl',type:'circle',source:'pts',filter:['==',['get','id'],-1],paint:{'circle-radius':22,'circle-color':'rgba(47,143,91,.22)','circle-stroke-width':2,'circle-stroke-color':'#2f8f5b','circle-translate':[0,-16]}});
 map.addLayer({id:'pt',type:'symbol',source:'pts',filter:['!',['has','point_count']],layout:{'icon-image':['concat','p-',['get','cat']],'icon-anchor':'bottom','icon-allow-overlap':true}});
 map.on('click','pt',ev=>popup(D[ev.features[0].properties.id]));
 ['pt','cl','pf'].forEach(l=>{if(!map.getLayer(l))return;map.on('mouseenter',l,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',l,()=>{map.getCanvas().style.cursor='';hl(null)})});
 map.on('mousemove','pt',ev=>hl(ev.features[0].properties.id));
 upd(true)});
const list=document.getElementById('list');
function upd(fit){const s=q.toLowerCase(),v=D.filter(d=>(!cat||d.cat==cat)&&(d.name+' '+(d.cuisine||'')+' '+(d.addr||'')).toLowerCase().includes(s));
 document.getElementById('count').textContent=v.length;
 if(map.getSource('pts')){map.getSource('pts').setData(fc(v));map.getSource('poly')&&map.getSource('poly').setData(pc(v));
  if(v.length&&(fit||cat||s)){const b=new maplibregl.LngLatBounds();v.forEach(d=>b.extend([d.lon,d.lat]));const m=innerWidth<760;map.fitBounds(b,{padding:m?{top:120,bottom:innerHeight*.45,left:30,right:30}:{top:90,bottom:50,left:60,right:60},maxZoom:15,duration:fit?0:800})}}
 list.innerHTML=v.map(d=>`<div class="card" data-id="${d.id}"><div class="dot" style="background:${d.c}">${svgI}</div><div class="ci"><h3>${e(d.name)}</h3><span class="pill" style="background:${d.c}1a;color:${d.c}">${e(d.cat)}</span>${d.cuisine?`<span class="pill" style="background:#f1f3f2;color:#4a544f">${e(d.cuisine.split(',')[0])}</span>`:''}<div class="ad">${e(d.addr||'McDonough area, GA')}</div></div><a class="dir" target="_blank" rel="noopener" href="${dirU(d)}" onclick="event.stopPropagation()">Directions</a></div>`).join('')||'<p style="color:#6b7570;padding:20px;text-align:center">No matches. Try another search.</p>';
 list.querySelectorAll('.card').forEach(c=>{const d=D[+c.dataset.id];c.onmouseenter=()=>hl(d.id);c.onmouseleave=()=>hl(null);c.onclick=()=>{map.flyTo({center:[d.lon,d.lat],zoom:Math.max(map.getZoom(),15.5),speed:1.3,offset:innerWidth<760?[0,-innerHeight*.2]:[0,60]});popup(d);hl(d.id)}})}
document.getElementById('q').oninput=ev=>{q=ev.target.value;upd()};
const P=document.getElementById('panel');document.getElementById('handle').onclick=()=>{P.className=P.className=='full'?'min':P.className=='min'?'':'full'};
</script></body></html>
